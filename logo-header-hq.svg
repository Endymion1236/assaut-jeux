<svg viewBox="0 0 600 200" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .letter { font-family: 'Arial Black', Arial, sans-serif; font-weight: 900; }
    </style>
  </defs>

  <!-- Arc en haut -->
  <path d="M 50 80 Q 300 20 550 80" 
        stroke="#001F47" 
        stroke-width="25" 
        fill="none" 
        stroke-linecap="round"/>

  <!-- LETTRES COMPACTES -->
  
  <!-- A - Bleu -->
  <text x="40" y="130" class="letter" font-size="90" fill="#001F47">A</text>
  <circle cx="65" cy="90" r="22" fill="white" opacity="0.85"/>

  <!-- L - Teal -->
  <text x="110" y="130" class="letter" font-size="90" fill="#1A9B8E">L</text>

  <!-- A - Orange -->
  <text x="175" y="130" class="letter" font-size="90" fill="#F5A623">A</text>

  <!-- D - Rouge -->
  <text x="240" y="130" class="letter" font-size="90" fill="#B81A1A">D</text>

  <!-- J - Violet -->
  <text x="305" y="130" class="letter" font-size="90" fill="#512D5E">J</text>

  <!-- Petits éléments de jeux -->
  
  <!-- Dé bleu mini -->
  <g transform="translate(390, 85)">
    <rect width="35" height="35" fill="#2A6F8F" rx="4"/>
    <circle cx="12" cy="12" r="3" fill="white"/>
    <circle cx="23" cy="23" r="3" fill="white"/>
    <circle cx="12" cy="23" r="3" fill="white"/>
  </g>

  <!-- Pion jaune mini -->
  <g transform="translate(440, 80)">
    <circle cx="17" cy="14" r="14" fill="#F5A623"/>
    <ellipse cx="17" cy="28" rx="14" ry="8" fill="#F5A623"/>
  </g>

  <!-- Dé rouge mini -->
  <g transform="translate(490, 85)">
    <rect width="35" height="35" fill="#B81A1A" rx="4"/>
    <circle cx="12" cy="12" r="3" fill="white"/>
    <circle cx="23" cy="23" r="3" fill="white"/>
    <circle cx="12" cy="23" r="3" fill="white"/>
    <circle cx="23" cy="12" r="3" fill="white"/>
  </g>

  <!-- Pion violet mini -->
  <g transform="translate(540, 80)">
    <circle cx="17" cy="14" r="13" fill="#512D5E"/>
    <ellipse cx="17" cy="27" rx="13" ry="7" fill="#512D5E"/>
  </g>
</svg>
