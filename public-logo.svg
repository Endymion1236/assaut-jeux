<svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <!-- Background -->
  <rect width="1000" height="1000" fill="white"/>
  
  <!-- Arc en haut -->
  <path d="M 150 350 Q 500 100 850 350" stroke="#001f47" stroke-width="60" fill="none" stroke-linecap="round"/>
  
  <!-- Lettres -->
  <!-- A -->
  <g>
    <rect x="100" y="280" width="140" height="320" fill="#001f47" rx="20"/>
    <circle cx="170" cy="380" r="70" fill="white"/>
    <rect x="110" y="480" width="120" height="60" fill="white"/>
  </g>
  
  <!-- L -->
  <g>
    <rect x="310" y="280" width="100" height="320" fill="#1a9b8e" rx="15"/>
  </g>
  
  <!-- A -->
  <g>
    <path d="M 520 580 L 460 280 L 620 280 L 560 580 Z" fill="#f5a623"/>
    <polygon points="480,420 600,420 540,480" fill="white"/>
  </g>
  
  <!-- D -->
  <g>
    <rect x="680" y="280" width="100" height="320" fill="#b81a1a" rx="20"/>
    <ellipse cx="780" cy="440" rx="90" ry="130" fill="white"/>
  </g>
  
  <!-- J -->
  <g>
    <rect x="850" y="280" width="110" height="200" fill="#512d5e" rx="15"/>
    <path d="M 860 480 Q 860 550 920 550 Q 960 550 960 510" stroke="#512d5e" stroke-width="80" fill="none" stroke-linecap="round"/>
  </g>
  
  <!-- Éléments de jeux -->
  <!-- Dé bleu (gauche) -->
  <g>
    <rect x="280" y="620" width="120" height="120" fill="#2a6f8f" rx="10"/>
    <circle cx="310" cy="650" r="12" fill="white"/>
    <circle cx="330" cy="670" r="12" fill="white"/>
    <circle cx="310" cy="710" r="12" fill="white"/>
    <circle cx="350" cy="710" r="12" fill="white"/>
  </g>
  
  <!-- Pion orange (centre) -->
  <g>
    <ellipse cx="500" cy="700" rx="70" ry="90" fill="#f5a623"/>
    <circle cx="500" cy="650" r="60" fill="#f5a623"/>
    <path d="M 450 700 Q 450 750 500 770 Q 550 750 550 700" fill="#f5a623"/>
    <circle cx="500" cy="640" r="35" fill="#e8950f"/>
  </g>
  
  <!-- Dé rouge (droite) -->
  <g>
    <rect x="600" y="620" width="120" height="120" fill="#b81a1a" rx="10"/>
    <circle cx="630" cy="650" r="12" fill="white"/>
    <circle cx="660" cy="670" r="12" fill="white"/>
    <circle cx="630" cy="710" r="12" fill="white"/>
    <circle cx="660" cy="710" r="12" fill="white"/>
    <circle cx="690" cy="730" r="12" fill="white"/>
  </g>
  
  <!-- Pion violet (très droite) -->
  <g>
    <ellipse cx="770" cy="700" rx="55" ry="70" fill="#512d5e"/>
    <circle cx="770" cy="660" r="50" fill="#512d5e"/>
    <path d="M 730 700 Q 730 740 770 755 Q 810 740 810 700" fill="#512d5e"/>
    <circle cx="770" cy="650" r="30" fill="#3d1f47"/>
  </g>
  
  <!-- Texte en bas -->
  <text x="500" y="900" font-family="Arial, sans-serif" font-size="80" font-weight="bold" text-anchor="middle" fill="#001f47">
    À L'ASSAUT DES JEUX
  </text>
  
  <!-- Trait décoratif gauche -->
  <path d="M 180 900 Q 200 920 220 900" stroke="#001f47" stroke-width="20" fill="none" stroke-linecap="round"/>
  
  <!-- Trait décoratif droit -->
  <path d="M 780 900 Q 800 920 820 900" stroke="#001f47" stroke-width="20" fill="none" stroke-linecap="round"/>
</svg>
